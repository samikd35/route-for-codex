<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc">
  <title id="title">How Route connects Codex to GPT</title>
  <desc id="desc">On the developer's computer, Codex Desktop or CLI exchanges Responses API messages with a local Caddy relay. Caddy authenticates to the upstream GPT API and streams its responses back. Codex runs tools in the workspace. The local Route service obtains credentials from the operating system.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172a3b; }
      .title { font-size: 22px; font-weight: 650; }
      .detail { font-size: 15px; }
      .region { font-size: 16px; font-weight: 650; }
      .edge { font-size: 14px; fill: #38516a; }
      .line { stroke: #38516a; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="395" fill="white"/>
  <rect x="14" y="18" width="665" height="356" rx="14" fill="#f4f7fb" stroke="#b8c8d7"/>
  <rect x="754" y="18" width="232" height="356" rx="14" fill="#f0f7f2" stroke="#b1c8b6"/>
  <text x="37" y="52" class="region">Developer’s computer</text>
  <text x="771" y="52" class="region">Model provider</text>
  <rect x="37" y="103" width="205" height="96" rx="9" fill="white" stroke="#728da4"/>
  <text x="139" y="139" text-anchor="middle" class="title">Codex</text>
  <text x="139" y="166" text-anchor="middle" class="detail">Desktop or CLI</text>
  <rect x="430" y="103" width="226" height="96" rx="9" fill="#dfebf6" stroke="#65859e"/>
  <text x="543" y="139" text-anchor="middle" class="title">Route</text>
  <text x="543" y="166" text-anchor="middle" class="detail">Local Caddy relay</text>
  <rect x="771" y="103" width="198" height="96" rx="9" fill="white" stroke="#68947a"/>
  <text x="870" y="139" text-anchor="middle" class="title">GPT API</text>
  <text x="870" y="166" text-anchor="middle" class="detail">Model inference</text>
  <path d="M250 151 H422 M257 146 L250 151 L257 156 M415 146 L422 151 L415 156" class="line"/>
  <text x="336" y="136" text-anchor="middle" class="edge">Responses API</text>
  <text x="336" y="177" text-anchor="middle" class="edge">Local token</text>
  <path d="M664 151 H763 M671 146 L664 151 L671 156 M756 146 L763 151 L756 156" class="line"/>
  <text x="714" y="136" text-anchor="middle" class="edge">HTTPS</text>
  <text x="714" y="177" text-anchor="middle" class="edge">API key</text>
  <path d="M139 207 V275 M134 214 L139 207 L144 214 M134 268 L139 275 L144 268" class="line"/>
  <text x="153" y="247" class="edge">Execute tools</text>
  <path d="M543 275 V207" class="line" stroke-dasharray="4 4"/>
  <path d="M538 214 L543 207 L548 214" class="line"/>
  <text x="557" y="247" class="edge">At startup</text>
  <rect x="37" y="283" width="205" height="68" rx="9" fill="white" stroke="#a8b9c6"/>
  <text x="139" y="322" text-anchor="middle" class="region">Workspace and shell</text>
  <rect x="430" y="283" width="226" height="68" rx="9" fill="white" stroke="#a8b9c6"/>
  <text x="543" y="322" text-anchor="middle" class="region">OS credential store</text>
</svg>
