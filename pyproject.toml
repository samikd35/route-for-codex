[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "route-for-codex"
version = "0.1.0.dev0"
description = "Connect local Codex sessions to your OpenAI API project"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "anyio>=4.5,<5", "httpx>=0.27,<1", "Pillow>=11.3,<14", "keyring>=25,<26", "tomlkit>=0.13,<1", "pywin32>=306; sys_platform=='win32'"]

[project.scripts]
route-for-codex = "route.cli:main"
route = "route.cli:main"

[tool.setuptools]
packages = ["route"]

[tool.setuptools.package-data]
route = ["bin/*"]
