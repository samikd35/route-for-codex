name: Build development installers
on:
  workflow_dispatch:
    inputs:
      live:
        description: Perform billable API-key qualification on both fresh runners
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-installers.yml'
      - '.github/workflows/native-installer.yml'
      - 'tests/**'
      - 'tools/**'
      - 'dispatcher/**'
      - 'route/**'
      - 'pyproject.toml'
      - '.dockerignore'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker buildx build --output type=local,dest=dist -f tools/linux.Dockerfile .
      - uses: actions/upload-artifact@v4
        with:
          name: route-debian-development
          path: dist/*.deb
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    uses: ./.github/workflows/native-installer.yml
    with:
      os: ${{ matrix.os }}
      live: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.live }}
    secrets:
      ROUTE_INSTALL_TEST_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.live && secrets.ROUTE_INSTALL_TEST_KEY || '' }}
