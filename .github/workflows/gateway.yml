name: Verified gateway binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/gateway.sha256', '.github/workflows/gateway.yml']
permissions:
  contents: write
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Cross-build and verify all gateway assets
        working-directory: dispatcher
        run: |
          mkdir "$RUNNER_TEMP/assets"
          for target in darwin-arm64 darwin-amd64 windows-arm64 windows-amd64; do
            GOOS="${target%-*}" GOARCH="${target#*-}" CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o "$RUNNER_TEMP/assets/dispatcher-$target" .
          done
          cd "$RUNNER_TEMP/assets"
          sha256sum -c "$GITHUB_WORKSPACE/tools/gateway.sha256"
      - name: Publish verified installer components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="gateway-$(git rev-parse HEAD:dispatcher)"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$RUNNER_TEMP"/assets/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'Route installer components' --notes 'Verified gateway binaries downloaded by the development CLI installer.'
          fi
